<canvas id="canvas" width="400" height="400"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// صورة فاضية بحجم الكانفس، هي اللي رح نرسم عليها
const img = ctx.createImageData(400, 400);

// دالة بتلوّن بكسل واحد بمكان (x, y)
function setPixel(x, y, r, g, b) {
  const i = (y * 400 + x) * 4;
  img.data[i]     = r;
  img.data[i + 1] = g;
  img.data[i + 2] = b;
  img.data[i + 3] = 255;
}

// نلوّن 100 بكسل بخط أحمر أفقي
for (let x = 100; x < 200; x++) {
  setPixel(x, 200, 255, 0, 0);
}

// نعرض الصورة على الكانفس
ctx.putImageData(img, 0, 0);
</script>
