<canvas id="canvas" width="400" height="400"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const img = ctx.createImageData(400, 400);

// NEW: paint the whole image black (alpha 255 = fully visible)
for (let i = 3; i < img.data.length; i += 4) img.data[i] = 255;

function setPixel(x, y, r, g, b) {
  if (x < 0 || x >= 400 || y < 0 || y >= 400) return;
  const i = (y * 400 + x) * 4;
  img.data[i]     = r;
  img.data[i + 1] = g;
  img.data[i + 2] = b;
  img.data[i + 3] = 255;
}

// Draw a line between two points, pixel by pixel
function drawLine(x0, y0, x1, y1, r, g, b) {
  const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
  for (let i = 0; i <= steps; i++) {
    const t = steps === 0 ? 0 : i / steps;
    const x = Math.round(x0 + (x1 - x0) * t);
    const y = Math.round(y0 + (y1 - y0) * t);
    setPixel(x, y, r, g, b);
  }
}

// A cube written as OBJ text
const objText = `
v -1 -1 -1
v  1 -1 -1
v  1  1 -1
v -1  1 -1
v -1 -1  1
v  1 -1  1
v  1  1  1
v -1  1  1
f 1 2 3
f 1 3 4
f 5 7 6
f 5 8 7
f 1 5 6
f 1 6 2
f 2 6 7
f 2 7 3
f 3 7 8
f 3 8 4
f 4 8 5
f 4 5 1
`;

function parseOBJ(text) {
  const vertices = [];
  const faces = [];
  for (const line of text.split('\n')) {
    const parts = line.trim().split(/\s+/);
    if (parts[0] === 'v') {
      vertices.push({
        x: parseFloat(parts[1]),
        y: parseFloat(parts[2]),
        z: parseFloat(parts[3])
      });
    }
    if (parts[0] === 'f') {
      faces.push([
        parseInt(parts[1]) - 1,
        parseInt(parts[2]) - 1,
        parseInt(parts[3]) - 1
      ]);
    }
  }
  return { vertices, faces };
}

// Convert a model point (-1..1) to a screen pixel (0..400)
function toScreen(v) {
  return {
    x: Math.round((v.x * 0.7 + 1) * 200),
    y: Math.round((1 - v.y * 0.7) * 200)
  };
}

const model = parseOBJ(objText);

// Draw the 3 edges of every triangle
for (const face of model.faces) {
  const a = toScreen(model.vertices[face[0]]);
  const b = toScreen(model.vertices[face[1]]);
  const c = toScreen(model.vertices[face[2]]);
  drawLine(a.x, a.y, b.x, b.y, 255, 255, 255);
  drawLine(b.x, b.y, c.x, c.y, 255, 255, 255);
  drawLine(c.x, c.y, a.x, a.y, 255, 255, 255);
}

ctx.putImageData(img, 0, 0);
</script>
