<pre id="out"></pre>
<script>
// A cube written as OBJ text. Later we will load a real file instead.
const objText = `
v -1 -1 -1
v  1 -1 -1
v  1  1 -1
v -1  1 -1
v -1 -1  1
v  1 -1  1
v  1  1  1
v -1  1  1
f 1 2 3
f 1 3 4
f 5 7 6
f 5 8 7
f 1 5 6
f 1 6 2
f 2 6 7
f 2 7 3
f 3 7 8
f 3 8 4
f 4 8 5
f 4 5 1
`;

// Read the text and collect vertices and faces
function parseOBJ(text) {
  const vertices = [];
  const faces = [];
  const lines = text.split('\n');

  for (const line of lines) {
    const parts = line.trim().split(/\s+/);

    if (parts[0] === 'v') {
      // v x y z -> a point
      vertices.push({
        x: parseFloat(parts[1]),
        y: parseFloat(parts[2]),
        z: parseFloat(parts[3])
      });
    }

    if (parts[0] === 'f') {
      // f a b c -> a triangle (subtract 1 because JS starts counting from 0)
      faces.push([
        parseInt(parts[1]) - 1,
        parseInt(parts[2]) - 1,
        parseInt(parts[3]) - 1
      ]);
    }
  }

  return { vertices, faces };
}

const model = parseOBJ(objText);

document.getElementById('out').textContent =
  'Vertices: ' + model.vertices.length + '\n' +
  'Triangles: ' + model.faces.length + '\n\n' +
  'First vertex: ' + JSON.stringify(model.vertices[0]) + '\n' +
  'First triangle: ' + JSON.stringify(model.faces[0]);
</script>
