<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>3D Software Renderer</title>
<style>
  body { background: #444; margin: 20px; }
  canvas { background: #000; display: block; }
</style>
</head>
<body>
<canvas id="canvas" width="800" height="800"></canvas>
<script>
const W = 800, H = 800;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const img = ctx.createImageData(W, H);

// Make every pixel opaque (black by default)
for (let i = 3; i < img.data.length; i += 4) img.data[i] = 255;

function setPixel(x, y, r, g, b) {
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  const i = (y * W + x) * 4;
  img.data[i]     = r;
  img.data[i + 1] = g;
  img.data[i + 2] = b;
  img.data[i + 3] = 255;
}

function drawLine(x0, y0, x1, y1, r, g, b) {
  const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
  for (let i = 0; i <= steps; i++) {
    const t = steps === 0 ? 0 : i / steps;
    const x = Math.round(x0 + (x1 - x0) * t);
    const y = Math.round(y0 + (y1 - y0) * t);
    setPixel(x, y, r, g, b);
  }
}

// Read an OBJ file. Faces look like "f 1/1/1 2/2/2 3/3/3",
// so we take only the number before the first "/".
function parseOBJ(text) {
  const vertices = [];
  const faces = [];
  for (const line of text.split('\n')) {
    const parts = line.trim().split(/\s+/);
    if (parts[0] === 'v') {
      vertices.push({
        x: parseFloat(parts[1]),
        y: parseFloat(parts[2]),
        z: parseFloat(parts[3])
      });
    }
    if (parts[0] === 'f') {
      const idx = parts.slice(1).map(p => parseInt(p.split('/')[0]) - 1);
      // If a face has more than 3 points, split it into triangles
      for (let i = 1; i < idx.length - 1; i++) {
        faces.push([idx[0], idx[i], idx[i + 1]]);
      }
    }
  }
  return { vertices, faces };
}

// Convert a model point (about -1..1) to a screen pixel
function toScreen(v) {
  return {
    x: Math.round((v.x * 0.9 + 1) * W / 2),
    y: Math.round((1 - v.y * 0.9) * H / 2)
  };
}

// Load the model from the website, then draw it
fetch('african_head.obj')
  .then(res => {
    if (!res.ok) throw new Error('african_head.obj not found');
    return res.text();
  })
  .then(text => {
    const model = parseOBJ(text);
    for (const face of model.faces) {
      const a = toScreen(model.vertices[face[0]]);
      const b = toScreen(model.vertices[face[1]]);
      const c = toScreen(model.vertices[face[2]]);
      drawLine(a.x, a.y, b.x, b.y, 255, 255, 255);
      drawLine(b.x, b.y, c.x, c.y, 255, 255, 255);
      drawLine(c.x, c.y, a.x, a.y, 255, 255, 255);
    }
    ctx.putImageData(img, 0, 0);
  })
  .catch(err => {
    document.body.insertAdjacentHTML('beforeend',
      '<p style="color:white">Error: ' + err.message + '</p>');
  });
</script>
</body>
</html>
